<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>ToDoList</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0f0f11;
            --surface: #1a1a1f;
            --surface-hover: #222228;
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(255,255,255,0.14);
            --accent: #c8f04e;
            --accent-dim: rgba(200, 240, 78, 0.12);
            --text: #f0efe8;
            --muted: #6b6a72;
            --done-text: #3a3a42;
            --danger: #ff5e5e;
            --radius: 14px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 3rem 1rem 5rem;
        }

        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
        }

        /* App title */
        .container > h1:first-child {
            font-family: 'Syne', sans-serif;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text);
            line-height: 1;
            margin-bottom: 6px;
        }

        .container > h1:first-child span {
            color: var(--accent);
        }

        /* Section label "Tasks" */
        .container > h1:nth-of-type(2) {
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 10px;
            margin-top: 2rem;
        }

        /* Tagline below title */
        .container > h1:first-child::after {
            content: 'Stay on top of everything.';
            display: block;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0;
            color: var(--muted);
            margin-top: 8px;
            margin-bottom: 2rem;
        }

        /* Input area */
        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 0;
        }

        .input {
            flex: 1;
            padding: 14px 18px;
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            caret-color: var(--accent);
        }

        .input::placeholder {
            color: var(--muted);
        }

        .input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(200, 240, 78, 0.1);
        }

        input[type="text"] {
            font-size: 15px;
        }

        .submit {
            padding: 14px 22px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            background: var(--accent);
            color: #0f0f11;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
            white-space: nowrap;
        }

        .submit:hover {
            background: #d8ff60;
            box-shadow: 0 4px 20px rgba(200, 240, 78, 0.25);
        }

        .submit:active {
            transform: scale(0.96);
        }

        /* List wrapper */
        .list {
            width: 100%;
        }

        .elementList {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            padding: 0;
        }

        /* Empty state */
        .elementList:empty::after {
            content: 'No tasks yet — add one above.';
            display: block;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            padding: 3rem 0;
        }

        /* Task items */
        .listItem {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            list-style: none;
            transition: background 0.15s, border-color 0.15s;
            animation: fadeSlide 0.2s ease both;
        }

        .listItem:hover {
            background: var(--surface-hover);
            border-color: var(--border-hover);
        }

        /* Completed state — add class "done" via JS */
        .listItem.done {
            opacity: 0.4;
        }

        .listItem.done span {
            text-decoration: line-through;
            color: var(--done-text);
        }

        /* Delete button */
        .delbtn {
            margin-left: auto;
            padding: 6px 10px;
            font-size: 12px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.15s;
            opacity: 0;
            flex-shrink: 0;
        }

        .listItem:hover .delbtn {
            opacity: 1;
        }

        .delbtn:hover {
            background: rgba(255, 94, 94, 0.1);
            border-color: rgba(255, 94, 94, 0.25);
            color: var(--danger);
        }

        /* Accent dot before task text */
        .listItem::before {
            content: '';
            width: 6px;
            height: 6px;
            min-width: 6px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.5;
            transition: opacity 0.15s;
        }

        .listItem:hover::before {
            opacity: 1;
        }

        .listItem.done::before {
            background: var(--muted);
            opacity: 0.3;
        }

        /* Entry animation */
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Hidden font-awesome icon in original HTML */
        .fas.fa-edit { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>To Do <span>List</span></h1>
        <div class="input-container">
            <input type="text" placeholder="What needs to get done?" class="input">
            <button class="submit">Add</button>
        </div>
        <h1>Tasks</h1>
        <div class="list">
            <ul class="elementList">
            </ul>
        </div>
    </div>
    <i class="fas fa-edit"></i>
    <script src="script.js"></script>
</body>
</html>
