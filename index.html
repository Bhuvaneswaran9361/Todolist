<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>ToDoList</title>
</head>
<body>
    <div class="container">
        <div class="app-header">
            <h1>To Do <span>List</span></h1>
            <p>Stay on top of everything.</p>
        </div>

        <div class="input-container">
            <input type="text" placeholder="What needs to get done?" class="input">
            <button class="submit">Add</button>
        </div>

        <div class="tasks-header">
            <span class="tasks-label">Tasks</span>
            <span id="task-count" class="task-count">No tasks yet</span>
        </div>

        <div class="list">
            <ul class="elementList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
